name: Refresh CSP data and deploy to Pages

# Refresh is triggered externally at 10 AM and 2 PM ET on weekdays by macOS
# launchd jobs running on the host workstation
# (~/Library/LaunchAgents/com.zvolvant.csp-refresh-{am,pm}.plist), which call
# `gh workflow run refresh.yml`. We rely on launchd instead of GHA `schedule:`
# because GitHub Actions does not guarantee schedule timing — 5–30 min delays
# at the top of the hour are common and runs are sometimes dropped entirely.
#
# Architecture: the scans are split across parallel jobs so each runs on its
# own runner (its own IP). Yahoo throttles yfinance per-IP, so running two
# full 503-ticker S&P scans in one job starved one of them. Giving each heavy
# S&P scan a dedicated runner removes the shared rate-limit entirely. The
# `assemble` job merges every job's data into docs/ and deploys once.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Eastern-time gate ──────────────────────────────────────────────────────
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Eastern-time gate (skip cron firings that aren't 10 AM / 2 PM ET)
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Non-schedule event (${{ github.event_name }}) — running."
            exit 0
          fi
          HOUR=$(TZ='America/New_York' date +%H)
          DOW=$(TZ='America/New_York' date +%u)   # 1=Mon … 7=Sun
          if [ "$DOW" -ge 6 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping — it's weekend in New York."
            exit 0
          fi
          if [ "$HOUR" = "10" ] || [ "$HOUR" = "14" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Current Eastern hour is $HOUR — running."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping — current Eastern hour is $HOUR (need 10 or 14)."
          fi

  # ── Primary 94-ticker tabs + dip (one runner) ──────────────────────────────
  build_main:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch options data — curated universe
        run: python scripts/fetch.py --tickers config/tickers.txt --out-dir docs --label "Curated"
      - name: Fetch options data — 60-90 DTE medium-term
        run: python scripts/fetch.py --tickers config/tickers.txt --out-dir docs/medium --dte-min 60 --dte-max 90 --max-delta 0.15 --no-exclude-earnings --label "60-90 DTE"
      - name: Fetch options data — +300 premium (10-15% delta, 30-90 DTE, ≥$300/contract)
        run: python scripts/fetch.py --tickers config/tickers.txt --out-dir docs/plus300 --min-delta 0.10 --max-delta 0.15 --dte-min 30 --dte-max 90 --min-premium 300 --no-exclude-earnings --label "+300"
      - name: Fetch options data — Dip Buys (top 20 daily losers)
        run: python scripts/fetch_dip.py --sp500-tickers config/tickers_sp500.txt --out-dir docs/dip --label "Dip Buys"
      - name: Upload site (page shells + primary-tab data)
        uses: actions/upload-artifact@v4
        with:
          name: site-main
          path: docs
          retention-days: 1

  # ── Full S&P 500 scan (dedicated runner / IP) ──────────────────────────────
  build_sp500:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch options data — S&P 500
        run: python scripts/fetch.py --tickers config/tickers_sp500.txt --out-dir out/sp500 --max-workers 4 --label "S&P 500"
      - name: Upload S&P 500 data
        uses: actions/upload-artifact@v4
        with:
          name: site-sp500
          path: out/sp500
          retention-days: 1

  # ── Full S&P 500 +300 scan (dedicated runner / IP) ─────────────────────────
  build_plus300sp500:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch options data — +300 S&P 500 (10-15% delta, 30-90 DTE, ≥$300/contract)
        run: python scripts/fetch.py --tickers config/tickers_sp500.txt --out-dir out/plus300sp500 --min-delta 0.10 --max-delta 0.15 --dte-min 30 --dte-max 90 --min-premium 300 --no-exclude-earnings --max-workers 4 --label "+300 S&P 500"
      - name: Upload +300 S&P data
        uses: actions/upload-artifact@v4
        with:
          name: site-plus300sp500
          path: out/plus300sp500
          retention-days: 1

  # ── Merge every job's data into docs/ and publish the Pages artifact ───────
  assemble:
    needs: [gate, build_main, build_sp500, build_plus300sp500]
    # Deploy as long as the gate says run and the primary tabs built. The heavy
    # S&P jobs are best-effort: if one fails, its download is skipped and the
    # previously committed data for that tab stays in place.
    if: ${{ always() && needs.gate.outputs.run == 'true' && needs.build_main.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download site (page shells + primary-tab data)
        uses: actions/download-artifact@v4
        with:
          name: site-main
          path: docs
      - name: Download S&P 500 data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: site-sp500
          path: docs/sp500
      - name: Download +300 S&P data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: site-plus300sp500
          path: docs/plus300sp500
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: assemble
    if: needs.assemble.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
