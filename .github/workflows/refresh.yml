name: Refresh CSP data and deploy to Pages

on:
  # 14:00 UTC ≈ 10:00 AM ET (EDT) | 09:00 ET (EST)
  # 18:00 UTC ≈ 02:00 PM ET (EDT) | 13:00 ET (EST)
  schedule:
    - cron: "0 14 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch options data
        run: python scripts/fetch.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
