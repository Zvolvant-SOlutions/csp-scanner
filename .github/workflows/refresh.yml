name: Refresh CSP data

on:
  # 14:00 UTC ≈ 10:00 AM ET (EDT) | 09:00 ET (EST)
  # 18:00 UTC ≈ 02:00 PM ET (EDT) | 13:00 ET (EST)
  # During EST winter, runs shift one hour earlier in local time.
  schedule:
    - cron: "0 14 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-csp-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch options data
        run: python scripts/fetch.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/meta.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  pages-build:
    needs: refresh
    runs-on: ubuntu-latest
    # GitHub Pages will auto-rebuild on push to /docs; this job is a no-op
    # placeholder you can wire up later if you switch to the new Pages action.
    steps:
      - run: echo "Pages will auto-rebuild from /docs on push."
